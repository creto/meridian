name: ci
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: node --experimental-strip-types --test src/lib/closure/wave2.test.ts src/lib/admin/console.test.ts src/lib/pdf/editor-model.test.ts src/lib/workflow/runtime.test.ts
