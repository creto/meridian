# Local stack. Web and worker drop to uid 10001 in the image.
# SMTP and OIDC are unset on purpose: those paths stay off until credentials exist.
# Do not add privileged: true.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: meridian
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-meridian}
      POSTGRES_DB: meridian
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meridian -d meridian"]
      interval: 5s
      timeout: 5s
      retries: 12

  otel:
    image: otel/opentelemetry-collector:0.111.0
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4318:4318"

  migrate:
    image: ${MERIDIAN_IMAGE:-meridian:local}
    user: "10001:10001"
    command: ["node", "scripts/migrate.mjs"]
    environment:
      DATABASE_URL: postgres://meridian:${POSTGRES_PASSWORD:-meridian}@postgres:5432/meridian
      MERIDIAN_MASTER_KEY: ${MERIDIAN_MASTER_KEY:?set MERIDIAN_MASTER_KEY}
      MERIDIAN_ENV: ${MERIDIAN_ENV:-production}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    image: ${MERIDIAN_IMAGE:-meridian:local}
    user: "10001:10001"
    environment:
      DATABASE_URL: postgres://meridian:${POSTGRES_PASSWORD:-meridian}@postgres:5432/meridian
      MERIDIAN_MASTER_KEY: ${MERIDIAN_MASTER_KEY:?set MERIDIAN_MASTER_KEY}
      MERIDIAN_ENV: ${MERIDIAN_ENV:-production}
      MERIDIAN_REQUIRE_AUTH: ${MERIDIAN_REQUIRE_AUTH:-1}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel:4318
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      otel:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/api/agent/v1/health/live').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  worker:
    image: ${MERIDIAN_IMAGE:-meridian:local}
    user: "10001:10001"
    command: ["node", "scripts/worker.mjs"]
    environment:
      DATABASE_URL: postgres://meridian:${POSTGRES_PASSWORD:-meridian}@postgres:5432/meridian
      MERIDIAN_MASTER_KEY: ${MERIDIAN_MASTER_KEY:?set MERIDIAN_MASTER_KEY}
      MERIDIAN_ENV: ${MERIDIAN_ENV:-production}
      MERIDIAN_REQUIRE_AUTH: ${MERIDIAN_REQUIRE_AUTH:-1}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel:4318
    depends_on:
      migrate:
        condition: service_completed_successfully
      otel:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

volumes:
  pgdata:
