apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-mcp
  labels:
    app: meridian
    component: mcp
spec:
  replicas: {{ .Values.mcp.replicas }}
  selector:
    matchLabels:
      app: meridian
      component: mcp
  template:
    metadata:
      labels:
        app: meridian
        component: mcp
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: mcp
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          args: ["node", "scripts/worker.mjs"]
          env:
            - name: MERIDIAN_ROLE
              value: mcp
          envFrom:
            - secretRef:
                name: {{ .Values.envFromSecret }}
          command: ["node", "-e", "setInterval(() => {}, 60000)"]
          # No port. MCP JSON is served by the API at /api/agent/v1/mcp/tools.
