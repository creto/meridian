apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-web
  labels:
    app: meridian
    component: web
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      app: meridian
      component: web
  template:
    metadata:
      labels:
        app: meridian
        component: web
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: web
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.web.port }}
          env:
            - name: MERIDIAN_ENV
              value: {{ .Values.env.meridianEnv | quote }}
            - name: MERIDIAN_REQUIRE_AUTH
              value: {{ .Values.env.requireAuth | quote }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://{{ .Release.Name }}-otel:4318
          envFrom:
            - secretRef:
                name: {{ .Values.envFromSecret }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            # Writable root is for temp files only. Postgres data is not in these pods.
            readOnlyRootFilesystem: false
          readinessProbe:
            httpGet:
              path: /api/agent/v1/health/live
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/agent/v1/health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
