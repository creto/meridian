# Deploy sketch. Replica counts and the image tag are overrides, not a live cluster.
# DATABASE_URL, MERIDIAN_MASTER_KEY, and connector credentials come from the
# secret named below. Do not inline the master key in this file.

image:
  repository: meridian
  tag: local
  pullPolicy: IfNotPresent

web:
  replicas: 2
  port: 8080

worker:
  replicas: 1

api:
  replicas: 2
  port: 8080

mcp:
  replicas: 1

pdf:
  replicas: 0

ai:
  replicas: 0

ingress:
  host: meridian.example.com

envFromSecret: meridian-env
config:
  logFormat: json
